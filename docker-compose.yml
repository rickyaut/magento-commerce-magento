version: '3'

services:
  web:
    image: localhost/ricky/magento-web:2.4.7-p4
    ports:
      - '80:80'
      - '443:443'
    environment:
      - TZ=Australia/Melbourne
      - BASE_URL=http://localhost
      - DB_HOST=db
      - DB_NAME=magento2
      - DB_USER=magento2
      - DB_PWD=magento2
      - SEARCH_ENGINE=opensearch
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=order.placed
      - COGNITO_REGION=${COGNITO_REGION:-ap-southeast-2}
      - COGNITO_DOMAIN=${COGNITO_DOMAIN}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-ap-southeast-2_lPK2PB3Hc}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-5qm9690pqgje0vmhkdkdunoc05}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET:-ol96ul9n2sep2ec831t45gdmclo18jcu8ls6qtjv7sb3utc7urf}
      - COGNITO_REDIRECT_URI=${COGNITO_REDIRECT_URI:-http://localhost/admin/adminsso/callback}
      - SEARCH_LAMBDA_URL=${SEARCH_LAMBDA_URL}
    depends_on:
      - db
      - opensearch
      - kafka
    volumes:
      - ./src:/var/www/magento2/app/code
    networks:
      - dev-env
  db:
    image: mariadb:10.6.13
    restart: always
    environment:
      TZ: 'Australia/Melbourne'
      MYSQL_ROOT_PASSWORD: 'magento2'
      MYSQL_USER: 'magento2'
      MYSQL_PASSWORD: 'magento2'
      MYSQL_DATABASE: 'magento2'
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - 3306:3306
    networks:
      - dev-env
  opensearch:
    image: opensearchproject/opensearch:2
    volumes:
      - ./opensearch_data:/usr/share/opensearch/data
    environment:
      - TZ=Australia/Melbourne
      - node.name=opensearch
      - cluster.name=opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: always
    ports:
      - 9200:9200
    networks:
      - dev-env
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: magento_ai
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d magento_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-env

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    environment:
      TZ: Australia/Melbourne
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://kafka:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_CLUSTER_ID: test-cluster-01
      KAFKA_LOG_DIRS: /opt/kafka/data
    volumes:
      - ./kafka_data:/opt/kafka/data  # Persist Kafka data
    networks:
      - dev-env
    ports:
      - "9092:9092"
      - "9093:9093"

networks:
  dev-env: {}